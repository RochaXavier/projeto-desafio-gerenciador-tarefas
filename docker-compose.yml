version: '3.4'

services:
  gerenciamentotarefas:
    image: ${DOCKER_REGISTRY-}gerenciamentotarefas
    build:
      context: .
      dockerfile: GerenciamentoTarefas/Dockerfile
    depends_on:
        - rabbitmq
        - mongo

  workerprocessartarefa:
    image: ${DOCKER_REGISTRY-}workerprocessartarefa
    build:
      context: .
      dockerfile: WorkerProcessarTarefa/Dockerfile
    depends_on:
        - rabbitmq
        - mongo

  mongo:
    image: mongo:8.0 
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017" # Expose MongoDB on the default port
    environment:
      MONGO_INITDB_ROOT_USERNAME: root # Set the admin username
      MONGO_INITDB_ROOT_PASSWORD: password # Set the admin password
    volumes:
      - mongo-data:/data/db # Persist MongoDB data
      - mongo-config:/data/configdb # Persist MongoDB configuration

  rabbitmq:
    container_name: rabbitmq-server
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=123

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local

